<div class="background">
    <div class="center">
        <h1>CREATE MEAL PLAN FOR {{username}}</h1>
        <div class="info">
            <mat-form-field class="text">
            <mat-label>BMI</mat-label>
                <input matInput type="text" name="bmi" [(ngModel)]="bmi" readonly="true">
            </mat-form-field>

            <mat-form-field class="text">
            <mat-label>Goal</mat-label>
            <input matInput type="text" name="goal" [(ngModel)]="goalText" readonly="true">
            </mat-form-field>

            <mat-form-field class="text">
            <mat-label>Physical activity</mat-label>
                <input matInput type="text" name="physicalActivity" [(ngModel)]="physicalActivityText" readonly="true">
            </mat-form-field>

            <mat-form-field class="text">
            <mat-label>Gender</mat-label>
                <input matInput type="text" name="gender" [(ngModel)]="genderText" readonly="true">
            </mat-form-field>
        </div>
        <div class="frm">
            <form #mealPlanForm="ngForm" (ngSubmit)="createMealPlan(mealPlanForm.value.content)">
                <mat-form-field class="inp">
                    <mat-label>Type your meal plan</mat-label>
                    <textarea matInput name="content" [(ngModel)]="defaultMealPlan">></textarea>
                </mat-form-field>
                <button mat-button class="btn" type="button" (click)="cancel()">Cancel</button>
                <button mat-button class="btn" type="submit" id="submitBtn">Submit</button>
            </form>
        </div>
        
    </div>
</div>
