<div class="background">
    <h1>EXAMINED PATIENTS WITHOUT MEAL PLAN</h1>
    
    <div class="filter-container">
        <div class="filter">
            <form #filterForm="ngForm" (ngSubmit)="filterDate(filterForm.value)" class="filter-form">
                <div class="form-row">
                    <mat-form-field class="picker">
                        <mat-label>Date from</mat-label>
                        <input matInput [matDatepicker]="pickerFrom" name="dateFrom" ngModel>
                        <mat-datepicker-toggle matIconSuffix [for]="pickerFrom"></mat-datepicker-toggle>
                        <mat-datepicker #pickerFrom></mat-datepicker>
                    </mat-form-field>

                    <mat-form-field class="picker">
                        <mat-label>Date to</mat-label>
                        <input matInput [matDatepicker]="pickerTo" name="dateTo" ngModel>
                        <mat-datepicker-toggle matIconSuffix [for]="pickerTo"></mat-datepicker-toggle>
                        <mat-datepicker #pickerTo></mat-datepicker>
                    </mat-form-field>
                    <button mat-button class="btn" id="filterBtn">FILTER</button>
                </div>
            </form>

            <form #filterNameForm="ngForm" (ngSubmit)="filterByName(filterNameForm.value)" class="filter-form">
                <div class="form-row">
                    <mat-form-field class="inputName">
                        <mat-label>Patient's name</mat-label>
                        <input matInput type="text" name="username" ngModel>
                    </mat-form-field>
                    <button mat-button class="btn" id="filterBtn">FILTER</button>
                </div>
            </form>

            <div class="form-row">
                <button mat-button class="btn reset-btn" (click)="reset()">RESET FILTERS</button>
            </div>
        </div>
    </div>
    
    <div class="center">
        <table mat-table [dataSource]="dataSource">
            <ng-container matColumnDef="patientsFullName">
            <th mat-header-cell *matHeaderCellDef> PATIENT NAME </th>
            <td mat-cell *matCellDef="let element"> {{element.patientsFullName}} </td>
        </ng-container>

        <ng-container matColumnDef="date">
            <th mat-header-cell *matHeaderCellDef> DATE </th>
            <td mat-cell *matCellDef="let element"> {{element.date | date:'dd.MM.yyyy - HH:mm'}} </td>
        </ng-container>

        <ng-container matColumnDef="mealPlan">
            <th mat-header-cell *matHeaderCellDef> CREATE MEAL PLAN </th>
            <td mat-cell *matCellDef="let element">
                 <button  mat-button color="warn" class="tablebtn" (click)="createMealPlan(element)">CREATE</button> 
            </td>
        </ng-container>

        <ng-container matColumnDef="healthInfo">
            <th mat-header-cell *matHeaderCellDef> USERS HEALTH INFO </th>
            <td mat-cell *matCellDef="let element">
                 <button  mat-button color="warn" class="tablebtn" (click)="usersHealthInfo(element.patientId)">HEALTH INFO</button> 
            </td>
        </ng-container>
        

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
    </div>
</div>
