<div class="background">
    <div class="center">
        <table mat-table [dataSource]="dataSource">

        <ng-container matColumnDef="appointmentId">
            <th mat-header-cell *matHeaderCellDef> APPOINTMENT ID </th>
            <td mat-cell *matCellDef="let element"> {{element.appointmentId}} </td>
        </ng-container>
    
        <ng-container matColumnDef="patientId">
            <th mat-header-cell *matHeaderCellDef> PATIENT ID </th>
            <td mat-cell *matCellDef="let element"> {{element.patientId}} </td>
        </ng-container>

        <ng-container matColumnDef="duration">
            <th mat-header-cell *matHeaderCellDef> DURATION </th>
            <td mat-cell *matCellDef="let element"> {{element.duration}} </td>
        </ng-container>

        <ng-container matColumnDef="date">
            <th mat-header-cell *matHeaderCellDef> DATE </th>
            <td mat-cell *matCellDef="let element"> {{element.date}} </td>
        </ng-container>

        <ng-container matColumnDef="mealPlan">
            <th mat-header-cell *matHeaderCellDef> CREATE MEAL PLAN </th>
            <td mat-cell *matCellDef="let element">
                 <button  mat-button color="warn" class="tablebtn" (click)="createMealPlan(element)">CREATE</button> 
            </td>
        </ng-container>
        

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
    </div>
</div>
