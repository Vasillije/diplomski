<div class="background">
    <div class="center">
        <!-- Appointment Info -->
        <div class="appointment-header" *ngIf="appointmentInfo">
            <h3>Appointment info</h3>
            <p><strong>Nutritionist:</strong> {{appointmentInfo.nutritionistFullName}}</p>
            <p><strong>Date:</strong> {{appointmentInfo.appointmentDate | date:'dd.MM.yyyy - HH:mm'}}</p>
            <p><strong>Type:</strong> {{appointmentInfo.type}}</p>
        </div>

        <!-- Complaint Form -->
        <div class="frm">
            <form #complaintForm="ngForm" (ngSubmit)="makeComplaint(complaintForm.value)">
                <mat-form-field class="inp">
                    <mat-label>Make your complaint</mat-label>
                    <textarea matInput name="complaint" ngModel></textarea>
                </mat-form-field>
                
                <div class="button-container">
                    <button mat-button class="btn cancel-btn" type="button" (click)="cancel()">Cancel</button>
                    <button mat-button class="btn submit-btn" type="submit">Submit</button>
                </div>
            </form>
        </div>
    </div>
</div>
