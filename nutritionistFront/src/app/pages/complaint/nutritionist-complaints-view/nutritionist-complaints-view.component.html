<div class="background">
    <div class="center">
        <table mat-table [dataSource]="dataSource">
            <ng-container matColumnDef="complaintId">
                <th mat-header-cell *matHeaderCellDef> COMPLAINT ID </th>
                <td mat-cell *matCellDef="let element"> {{element.id}} </td>
            </ng-container>

            <ng-container matColumnDef="appointmentId">
                <th mat-header-cell *matHeaderCellDef> APPOINTMENT ID </th>
                <td mat-cell *matCellDef="let element"> {{element.id}} </td>
            </ng-container>
    
            <ng-container matColumnDef="content">
                <th mat-header-cell *matHeaderCellDef> CONTENT </th>
                <td mat-cell *matCellDef="let element"> {{element.content}} </td>
            </ng-container>

            <ng-container matColumnDef="answer">
                <th mat-header-cell *matHeaderCellDef> ANSWER COMPLAINT </th>
                <td mat-cell *matCellDef="let element; let i = index"> 
                    <button mat-button color="warn" class="tablebtn" (click)="answerComplaint(element.id)">ANSWER</button>
                </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
    </div>
</div>
