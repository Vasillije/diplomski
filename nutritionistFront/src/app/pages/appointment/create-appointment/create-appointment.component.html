<div class="background">
    <div class="center1">
        <h1><b>CREATE APPOINTMENT</b></h1>
            <form #createAppointmentForm="ngForm" (ngSubmit)="createAppointment(createAppointmentForm.value)">
                
                  <mat-form-field>
                    <mat-label>Choose a date</mat-label>
                    <!--[(ngModel)]="dto.date" dodati u ovo dole ako zatreba-->
                     <input matInput [matDatepicker]="picker"  [min]="minDate" name="appointmentDate" ngModel required
                     (dateChange)="onDateChange($event)"> 
                    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                    <mat-datepicker #picker></mat-datepicker>
                  </mat-form-field>

                  <mat-form-field class="polje">
                    <mat-label>Choose a time</mat-label>
                    <input type="text" matInput [matTimepicker]="timepicker" name="time" ngModel required />
                    <mat-timepicker-toggle matSuffix [for]="timepicker"></mat-timepicker-toggle>
                    <mat-timepicker #timepicker format="24h"></mat-timepicker>
                  </mat-form-field>

                  <mat-form-field>
                    <mat-label>Type</mat-label>
                    <mat-select name="type" ngModel>
                      @for (type of types; track type) {
                        <mat-option [value]="type.value">{{type.viewValue}}</mat-option>
                      }
                    </mat-select>
                  </mat-form-field>

                <button mat-button class="btn">Create</button>
            </form>
            <table mat-table [dataSource]="dataSource">
    
        <ng-container matColumnDef="date">
            <th mat-header-cell *matHeaderCellDef> DATE </th>
            <td mat-cell *matCellDef="let element"> {{element.date}} </td>
        </ng-container>
    
        <ng-container matColumnDef="type">
            <th mat-header-cell *matHeaderCellDef> TYPE </th>
            <td mat-cell *matCellDef="let element; let i = index"> {{appointmentType[i]}} </td>
        </ng-container>

        <ng-container matColumnDef="duration">
            <th mat-header-cell *matHeaderCellDef> DURATION(MIN) </th>
            <td mat-cell *matCellDef="let element"> {{element.duration}} </td>
        </ng-container>
    
        <ng-container matColumnDef="patient">
            <th mat-header-cell *matHeaderCellDef> PATIENT </th>
            <td mat-cell *matCellDef="let element; let i = index"> {{patientFullName[i]}} </td>
        </ng-container>

        
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
        </div>
</div>
