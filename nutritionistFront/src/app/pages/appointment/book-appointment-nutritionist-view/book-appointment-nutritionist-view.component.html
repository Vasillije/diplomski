<div class="background">
  <div class="header-container">
    <h1>BOOK APPOINTMENT</h1>

      <div class="filter-row">
        <form #filterForm="ngForm" class="filter-form">
            <mat-form-field class="inputName">
            <mat-label>Choose a date</mat-label>
            <input matInput 
                    [matDatepicker]="picker" 
                    [(ngModel)]="selectedDate"  
                    [matDatepickerFilter]="myFilter"
                    [min]="minDate" 
                    name="appointmentDate"
                    (dateChange)="onDateChange($event.value)"> 
            <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
            </mat-form-field>
        </form>
    </div>

    <div class="filter-row" *ngIf="selectedDate">
      <mat-form-field class="inputName">  
          <mat-label>Choose patient</mat-label>
          <mat-select [(ngModel)]="selectedPatientName" name="name" required
                      (selectionChange)="onNameChange($event.value)">
              <mat-option *ngFor="let patient of patientsFullNames" 
                        [value]="patient.patientFullName">  <!-- 👈 Promeni ovo -->
                  {{ patient.patientFullName }}  <!-- 👈 I ovo -->
              </mat-option>
          </mat-select>
      </mat-form-field>
  </div>

    <div class="filter-row" *ngIf="selectedPatientName && selectedDate">
        <mat-form-field class="inputName">  
            <mat-label>Choose type</mat-label>
            <mat-select [(ngModel)]="selectedType" name="type" required
                        (selectionChange)="onTypeChange($event.value)">
                <mat-option *ngFor="let type of availableTypes" [value]="type">
                {{ type }}
                </mat-option>
            </mat-select>
        </mat-form-field>
    </div>

    

      <div *ngIf="selectedType && selectedDate && selectedPatientName" class="divv">

      <!-- Tabela -->
      <div class="center">
        <div class="table-container">
          <table mat-table [dataSource]="dataSource">
            <ng-container matColumnDef="date">
              <th mat-header-cell *matHeaderCellDef> DATE </th>
              <td mat-cell *matCellDef="let element"> {{element.date | date:'dd.MM.yyyy - HH:mm'}} </td>
            </ng-container>

            <ng-container matColumnDef="duration">
              <th mat-header-cell *matHeaderCellDef> DURATION </th>
              <td mat-cell *matCellDef="let element"> {{element.duration}} min </td>
            </ng-container>

            <ng-container matColumnDef="book">
              <th mat-header-cell *matHeaderCellDef> BOOK APPOINTMENT </th>
              <td mat-cell *matCellDef="let element">
                <button class="tablebtn" mat-button (click)="bookNutritionist(element)">BOOK</button>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns" sticky></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
