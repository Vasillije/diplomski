<div class="background">
    <div class="center">
        <table mat-table [dataSource]="dataSource">
            <ng-container matColumnDef="date">
                <th mat-header-cell *matHeaderCellDef> DATE </th>
                <td mat-cell *matCellDef="let element"> {{element.date}} </td>
            </ng-container>
        
            <ng-container matColumnDef="type">
                <th mat-header-cell *matHeaderCellDef> TYPE </th>
                <td mat-cell *matCellDef="let element; let i = index"> {{appointmentType[i]}} </td>
            </ng-container>
    
            <ng-container matColumnDef="duration">
                <th mat-header-cell *matHeaderCellDef> DURATION(MIN) </th>
                <td mat-cell *matCellDef="let element"> {{element.duration}} </td>
            </ng-container>
        
            <ng-container matColumnDef="nutritionist">
                <th mat-header-cell *matHeaderCellDef> NUTRITIONIST </th>
                <td mat-cell *matCellDef="let element; let i = index"> {{nutritionistFullName[i]}} </td>
            </ng-container>

            <ng-container matColumnDef="cancel">
                <th mat-header-cell *matHeaderCellDef> CANCEL APPOINTMENT </th>
                <td mat-cell *matCellDef="let element; let i = index"> 
                    <ng-container *ngIf="canBeCancelled(element.date)">
                        <button mat-button color="warn" class="tablebtn" (click)="cancelAppointmentPatient(element.appointmentId)">CANCEL</button>
                    </ng-container>
                </td>
            </ng-container>

            <ng-container matColumnDef="complaint">
                <th mat-header-cell *matHeaderCellDef> MAKE COMPLAINT </th>
                <td mat-cell *matCellDef="let element; let i = index"> 
                    <ng-container *ngIf="canMakeComplaint(element) && element.hasComplaint == false">
                        <button  mat-button color="warn" class="tablebtn" (click)="makeComplaint(element)">MAKE COMPLAINT</button>
                      </ng-container>    
                </td>
            </ng-container>

            

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
        <div class="buttons">
            <button mat-button class="btn" (click)="getOnlyConsultation()">CONSULTATIONS</button>
            <button mat-button class="btn" (click)="getOnlyControls()" >CONTROLS</button>
            <button mat-button class="btn" (click)="getOnlyExaminations()" >EXAMINATIONS</button>
        </div>
    </div>
</div>
