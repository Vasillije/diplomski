<div class="background">
    <!-- Naslov -->
    <h1>SCHEDULED APPOINTMENTS</h1>
    
    <!-- Kontejner za filtere -->
    <div class="filter-container">
        <!-- Prvi red - Filter po datumu -->
        <div class="filter-row">
            <form #filterForm="ngForm" (ngSubmit)="filterDate(filterForm.value)" class="filter-form">
                <mat-form-field class="picker">
                    <mat-label>Date from</mat-label>
                    <input matInput [matDatepicker]="pickerFrom" name="dateFrom" ngModel>
                    <mat-datepicker-toggle matIconSuffix [for]="pickerFrom"></mat-datepicker-toggle>
                    <mat-datepicker #pickerFrom></mat-datepicker>
                </mat-form-field>

                <mat-form-field class="picker">
                    <mat-label>Date to</mat-label>
                    <input matInput [matDatepicker]="pickerTo" name="dateTo" ngModel>
                    <mat-datepicker-toggle matIconSuffix [for]="pickerTo"></mat-datepicker-toggle>
                    <mat-datepicker #pickerTo></mat-datepicker>
                </mat-form-field>
                <button mat-button class="btn" id="filterBtn">FILTER</button>
            </form>
        </div>

        <!-- Drugi red - Filter po imenu -->
        <div class="filter-row">
            <form #filterNameForm="ngForm" (ngSubmit)="filterByName(filterNameForm.value)" class="filter-form">
                <mat-form-field class="inputName">
                    <mat-label>Nutritionist's name</mat-label>
                    <input matInput type="text" name="username" ngModel>
                </mat-form-field>
                <button mat-button class="btn" id="filterBtn">FILTER</button>
            </form>
        </div>

        <!-- Treći red - Tipovi appointmenta -->
        <div class="filter-row">
            <button mat-button class="btn" (click)="getConsultations()">CONSULTATIONS</button>
            <button mat-button class="btn" (click)="getControls()">CONTROLS</button>
            <button mat-button class="btn" (click)="getExaminations()">EXAMINATIONS</button>
            <button mat-button class="btn" (click)="getPastAppointments()">PAST APPOINTMENTS</button>
            <button mat-button class="btn" (click)="getFutureAppointments()">FUTURE APPOINTMENTS</button>
        </div>
    </div>

    <!-- Tabela -->
    <div class="center">
        <div class="table-container">
            <table mat-table [dataSource]="dataSource">
                            <ng-container matColumnDef="date">
                <th mat-header-cell *matHeaderCellDef> DATE </th>
                <td mat-cell *matCellDef="let element"> {{element.date| date:'dd.MM.yyyy - HH:mm'}} </td>
            </ng-container>
        
            <ng-container matColumnDef="type">
                <th mat-header-cell *matHeaderCellDef> TYPE </th>
                <td mat-cell *matCellDef="let element">
                    <span *ngIf="element.duration === 20">CONSULTATION</span>
                    <span *ngIf="element.duration === 40">CONTROL</span>
                    <span *ngIf="element.duration === 60">EXAMINATION</span>
                    <span *ngIf="element.duration !== 20 && element.duration !== 40 && element.duration !== 60">
                        UNKNOWN ({{element.duration}})
                    </span>
                </td>
            </ng-container>
    
            <ng-container matColumnDef="duration">
                <th mat-header-cell *matHeaderCellDef> DURATION </th>
                <td mat-cell *matCellDef="let element"> {{element.duration}}  min</td>
            </ng-container>
        
            <ng-container matColumnDef="nutritionist">
                <th mat-header-cell *matHeaderCellDef> NUTRITIONIST </th>
                <td mat-cell *matCellDef="let element; let i = index"> {{element.nutritionistFullName}} </td>
            </ng-container>

            <ng-container matColumnDef="cancel">
                <th mat-header-cell *matHeaderCellDef> CANCEL APPOINTMENT </th>
                <td mat-cell *matCellDef="let element; let i = index"> 
                    <ng-container *ngIf="canBeCancelled(element.date)">
                        <button mat-button color="warn" class="tablebtn" (click)="cancelAppointmentPatient(element)">CANCEL</button>
                    </ng-container>
                </td>
            </ng-container>

            <ng-container matColumnDef="complaint">
                <th mat-header-cell *matHeaderCellDef> MAKE COMPLAINT </th>
                <td mat-cell *matCellDef="let element; let i = index"> 
                    <ng-container *ngIf="canMakeComplaint(element) && element.hasComplaint == false">
                        <button  mat-button color="warn" class="tablebtn" (click)="makeComplaint(element)">MAKE COMPLAINT</button>
                      </ng-container>    
                </td>
            </ng-container>

            

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>
        </div>
    </div>
</div>
