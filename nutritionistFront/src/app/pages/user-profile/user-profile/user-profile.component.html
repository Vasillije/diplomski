<div class="background">
  <img src="register.jpg" class="img" alt="Background">
  <button mat-button class="finish" (click)="finish()">Finish</button>
<div class="background1" *ngIf="user">
    <div class="center-left">
        <h2>GENERAL INFO</h2>
        <form #generalInfoForm="ngForm" (ngSubmit)="changeGeneralInfo(generalInfoForm.value)">
            <mat-form-field>
                <mat-label>Username</mat-label>
                <input matInput type="text" name="username" [(ngModel)]="user.username">
            </mat-form-field>
            <mat-form-field>
                <mat-label>Change password</mat-label>
                <input matInput type="password" name="password" ngModel>
            </mat-form-field>
            <mat-form-field>
                <mat-label>Retype changed password</mat-label>
                <input matInput type="password" name="retypedPassword" ngModel>
            </mat-form-field>
            <mat-form-field>
                <mat-label>Name</mat-label>
                <input matInput type="text" name="name" [(ngModel)]="user.name">
            </mat-form-field>
            <mat-form-field>
                <mat-label>Last name</mat-label>
                <input matInput type="text" name="lastname" [(ngModel)]="user.lastname">
            </mat-form-field>
            <mat-form-field>
                <mat-label>Penalty points</mat-label>
                <input matInput type="text" name="penaltyPoints" [(ngModel)]="user.penaltyPoints" readonly="true">
            </mat-form-field>
            <button mat-button class="btn">Update general info</button>
        </form>
    </div>
    <div class="center">
        <h2>HEALTH INFO</h2>
        <form #healthInfoForm="ngForm" (ngSubmit)="changeHealthInfo(healthInfoForm.value)">
          
              <mat-form-field appearance="fill">
                <mat-label>Gender</mat-label>
                <mat-select name="gender" [(ngModel)]="user.gender">
                  <mat-option *ngFor="let option of genderOptions" [value]="option.value">
                    {{ option.viewValue }}
                  </mat-option>
                </mat-select>
              </mat-form-field>

              <mat-form-field appearance="fill">
                <mat-label>Physical activity</mat-label>
                <mat-select name="physicalActivity" [(ngModel)]="user.physicalActivity">
                  <mat-option *ngFor="let option of activityOptions" [value]="option.value">
                    {{ option.viewValue }}
                  </mat-option>
                </mat-select>
              </mat-form-field>


            <mat-form-field>
                <mat-label>Weight</mat-label>
                <input matInput type="text" name="weight" [(ngModel)]="user.weight">
            </mat-form-field>
            <mat-form-field>
                <mat-label>Height</mat-label>
                <input matInput type="text" name="height" [(ngModel)]="user.height">
            </mat-form-field>
            <mat-form-field>
                <mat-label>Age</mat-label>
                <input matInput type="text" name="age" [(ngModel)]="user.age">
            </mat-form-field>

              <mat-form-field appearance="fill">
                <mat-label>Goal</mat-label>
                <mat-select name="goal" [(ngModel)]="user.goal">
                  <mat-option *ngFor="let option of goalOptions" [value]="option.value">
                    {{ option.viewValue }}
                  </mat-option>
                </mat-select>
              </mat-form-field>

              <mat-form-field appearance="fill">
                <mat-label>Diseases</mat-label>
                <mat-select [(ngModel)]="diseasesValue" name="diseases">
                  <mat-option *ngFor="let option of diseasesOptions" [value]="option.value">
                    {{ option.viewValue }}
                  </mat-option>
                </mat-select>
              </mat-form-field>


            <button mat-button class="btn">Update health info</button>
        </form>
    </div>
    <div class="center-right">
        <h2>CONTACT INFO</h2>
        <form #contactInfoForm="ngForm" (ngSubmit)="changeContactInfo(contactInfoForm.value)">
            <mat-form-field>
                <mat-label>Email</mat-label>
                <input matInput type="text" name="email" [(ngModel)]="user.email">
            </mat-form-field>
            <mat-form-field>
                <mat-label>Phone number</mat-label>
                <input matInput type="text" name="phone" [(ngModel)]="user.phone">
            </mat-form-field>
            <mat-form-field>
                <mat-label>Address</mat-label>
                <input matInput type="text" name="address" [(ngModel)]="user.address">
            </mat-form-field>
            <button mat-button class="btn">Update contact info</button>
        </form>
        
    </div>
    
</div>
</div>
